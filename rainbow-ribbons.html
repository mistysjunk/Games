<style>
/* Layout: one sideways night-sky sheet that fills the screen. The picture sits in the middle,
   small text buttons sit in the corners, and the collection opens over the top. Single dark look by choice. */
:root {
  color-scheme: dark;
  --night: #080b26;        /* sky */
  --glow-blue: #1c2a70;    /* soft patches of light in the sky */
  --glow-plum: #24175c;
  --loose: #8f95b8;        /* a line that is not in place yet */
  --gold: #ffd35c;         /* the line you are holding */
  --text: #ece9ff;
  --text-soft: #a9acd4;
  --edge: #3a418a;         /* button and tile outlines */
  --panel: #0a0e2e;
  --font-sign: "Sacramento", "Snell Roundhand", "Brush Script MT", cursive;
  --font-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
}
html, body { height: 100%; }
body {
  margin: 0;
  position: relative;
  overflow: hidden;
  overscroll-behavior: none;
  background: var(--night);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 0.9375rem;
  line-height: 1.4;
}
h2, p { margin: 0; }
[hidden] { display: none !important; }

#stage {
  position: absolute;
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  cursor: ew-resize;
  background:
    radial-gradient(55% 75% at 16% 10%, var(--glow-blue) 0%, transparent 62%),
    radial-gradient(45% 70% at 88% 84%, var(--glow-plum) 0%, transparent 66%),
    radial-gradient(40% 60% at 58% 42%, #121a58 0%, transparent 70%),
    var(--night);
}
#art { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }

/* Lines: four stacked strokes make the neon tube and its glow without slowing the phone down */
#lines path, #details path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.ln path { transition: stroke 0.3s ease, opacity 0.3s ease, stroke-width 0.3s ease; }
.ln .halo { stroke: var(--c); stroke-width: 6; opacity: 0; }
.ln .mid  { stroke: var(--c); stroke-width: 2.8; opacity: 0; }
.ln .core { stroke: var(--loose); stroke-width: 0.65; opacity: 0.8; }
.ln .hot  { stroke: #ffffff; stroke-width: 0.3; opacity: 0; }
/* the joins of a "fade" line: faint while you play, gone once the picture is made */
.ln path.link { opacity: 0.4 !important; transition: opacity 0.9s ease 0.15s !important; }
#stage.solved .ln path.link { opacity: 0 !important; }
.ln.placed .mid  { opacity: 0.2; }
.ln.placed .core { stroke: var(--c); stroke-width: 0.9; opacity: 0.95; }
.ln.sel .halo { stroke: var(--gold); opacity: 0.14; }
.ln.sel .mid  { stroke: var(--gold); opacity: 0.38; }
.ln.sel .core { stroke: var(--gold); stroke-width: 1.1; opacity: 1; }
.ln.sel .hot  { opacity: 0.75; }
#stage.solved .ln .halo { stroke: var(--c); opacity: 0.15; }
#stage.solved .ln .mid  { stroke: var(--c); opacity: 0.42; }
#stage.solved .ln .core { stroke: var(--c); stroke-width: 1.1; opacity: 1; }
#stage.solved .ln .hot  { opacity: 0.7; }
/* sample colors for the line you are holding (the Color button): rainbow, a new color each time, or shimmering */
.ln path.rb { display: none; stroke-linecap: butt; }
#stage.cm-rainbow:not(.solved) .ln.sel path.rb { display: inline; stroke-width: 1.15; opacity: 1; }
#stage.fine.cm-rainbow .ln.sel path.rb { stroke-width: 0.8; }
#stage.fine.slim.cm-rainbow .ln.sel path.rb { stroke-width: 0.6; }
#stage.fine.wisp.cm-rainbow .ln.sel path.rb { stroke-width: 0.48; }
#stage.cm-rainbow .ln.sel .rb0 { stroke: #ff6fb5; } #stage.cm-rainbow .ln.sel .rb1 { stroke: #ffd35c; } #stage.cm-rainbow .ln.sel .rb2 { stroke: #6dff8e; }
#stage.cm-rainbow .ln.sel .rb3 { stroke: #5ad7ff; } #stage.cm-rainbow .ln.sel .rb4 { stroke: #b48cff; } #stage.cm-rainbow .ln.sel .rb5 { stroke: #ff9a3d; }
#stage.cm-rainbow .ln.sel .core { opacity: 0; }
#stage.cm-rainbow .ln.sel .halo, #stage.cm-rainbow .ln.sel .mid { stroke: #ffffff; }   /* a soft white glow round the rainbow line */
#stage.cm-shimmer .ln.sel path:not(.link), #stage.cm-shimmer .ln.sel .core { stroke: url(#rbs); }
#stage.cm-cycle .ln.sel path:not(.link), #stage.cm-cycle .ln.sel .core { stroke: var(--selc, #ffd35c); }
#stage.cm-rainbow .ln.sel .hot, #stage.cm-shimmer .ln.sel .hot, #stage.cm-cycle .ln.sel .hot { stroke: #ffffff; }
/* sample colors for the loose lines you have not picked (the Lines button) */
#stage.lm-own:not(.solved) .ln:not(.sel):not(.placed) .core, #stage.lm-few:not(.solved) .ln:not(.sel):not(.placed) .core { stroke: var(--lc); opacity: 0.85; }
#stage.lm-rain:not(.solved) .ln:not(.sel):not(.placed) .core { stroke: url(#rb); opacity: 0.85; }
#stage.lm-pic:not(.solved) .ln:not(.sel):not(.placed) .core { stroke: var(--c); opacity: 0.7; }
#stage.lm-own .ln.sel .halo, #stage.lm-few .ln.sel .halo, #stage.lm-rain .ln.sel .halo, #stage.lm-pic .ln.sel .halo { opacity: 0.28; }   /* the line you hold glows brighter, so it still stands out */
#stage.lm-own .ln.sel .mid, #stage.lm-few .ln.sel .mid, #stage.lm-rain .ln.sel .mid, #stage.lm-pic .ln.sel .mid { opacity: 0.6; }
#details { opacity: 0; transition: opacity 0.9s ease 0.2s; }
#stage.solved #details { opacity: 1; }
#details .halo { stroke-width: 2.4; opacity: 0.28; }
#details .core { stroke-width: 0.6; }
/* Finer look, used on the drawings with flowing lines: faint thin waiting lines, a slim tube and a soft glow */
#stage.fine .ln .core { stroke-width: 0.42; opacity: 0.5; }
#stage.fine .ln.placed .core { stroke-width: 0.7; opacity: 0.95; }
#stage.fine .ln.placed .mid { stroke-width: 2; opacity: 0.16; }
#stage.fine .ln.sel .halo { stroke-width: 4.5; opacity: 0.1; }
#stage.fine .ln.sel .mid { stroke-width: 2; opacity: 0.3; }
#stage.fine .ln.sel .core { stroke-width: 0.75; opacity: 1; }
#stage.fine .ln.sel .hot { stroke-width: 0.22; }
#stage.fine.solved .ln .halo { stroke-width: 4.5; opacity: 0.12; }
#stage.fine.solved .ln .mid { stroke-width: 2.1; opacity: 0.34; }
#stage.fine.solved .ln .core { stroke-width: 0.85; opacity: 1; }
#stage.fine.solved .ln .hot { stroke-width: 0.24; }
#stage.fine .ln.thin .core { stroke-width: 0.18; opacity: 0.75; }
#stage.fine .ln.thin.sel .halo { stroke-width: 2.6; }
#stage.fine .ln.thin.sel .mid { stroke-width: 1; }
#stage.fine .ln.thin.sel .core { stroke-width: 0.34; opacity: 1; }
#stage.fine .ln.thin.sel .hot { stroke-width: 0.1; }
#stage.fine.solved .ln.thin .halo { stroke-width: 1.8; opacity: 0.1; }
#stage.fine.solved .ln.thin .mid { stroke-width: 0.8; opacity: 0.3; }
#stage.fine.solved .ln.thin .core { stroke-width: 0.28; opacity: 1; }
#stage.fine.solved .ln.thin .hot { stroke-width: 0.09; }
#stage.fine #details .halo { stroke-width: 1.8; opacity: 0.22; }
#stage.fine #details .core { stroke-width: 0.45; }
#stage.fine #details .halo.thin { stroke-width: 0.8; opacity: 0.2; }
#stage.fine #details .core.thin { stroke-width: 0.22; }
/* slim drawings: every line about a third thinner, for dainty pictures */
#stage.fine.slim .ln .core { stroke-width: 0.28; opacity: 0.6; }
#stage.fine.slim .ln.sel .halo { stroke-width: 3.2; }
#stage.fine.slim .ln.sel .mid { stroke-width: 1.4; }
#stage.fine.slim .ln.sel .core { stroke-width: 0.5; opacity: 1; }
#stage.fine.slim .ln.sel .hot { stroke-width: 0.16; }
#stage.fine.slim.solved .ln .halo { stroke-width: 3.2; opacity: 0.11; }
#stage.fine.slim.solved .ln .mid { stroke-width: 1.4; opacity: 0.32; }
#stage.fine.slim.solved .ln .core { stroke-width: 0.55; opacity: 1; }
#stage.fine.slim.solved .ln .hot { stroke-width: 0.16; }
#stage.fine.slim .ln.thin .core { stroke-width: 0.2; opacity: 0.65; }
#stage.fine.slim .ln.thin.sel .core { stroke-width: 0.36; opacity: 1; }
#stage.fine.slim .ln.thin.sel .mid { stroke-width: 1; }
#stage.fine.slim.solved .ln.thin .halo { stroke-width: 2; opacity: 0.1; }
#stage.fine.slim.solved .ln.thin .mid { stroke-width: 0.9; opacity: 0.3; }
#stage.fine.slim.solved .ln.thin .core { stroke-width: 0.34; opacity: 1; }
#stage.fine.slim.solved .ln.thin .hot { stroke-width: 0.1; }
#stage.fine.slim #details .halo { stroke-width: 1.2; opacity: 0.2; }
#stage.fine.slim #details .core { stroke-width: 0.3; }
/* wisp drawings: finer still, for portraits packed with detail */
#stage.fine.wisp .ln .core { stroke-width: 0.2; opacity: 0.6; }
#stage.fine.wisp .ln.sel .halo { stroke-width: 2.6; }
#stage.fine.wisp .ln.sel .mid { stroke-width: 1.1; }
#stage.fine.wisp .ln.sel .core { stroke-width: 0.38; opacity: 1; }
#stage.fine.wisp .ln.sel .hot { stroke-width: 0.12; }
#stage.fine.wisp.solved .ln .halo { stroke-width: 2.6; opacity: 0.11; }
#stage.fine.wisp.solved .ln .mid { stroke-width: 1.1; opacity: 0.32; }
#stage.fine.wisp.solved .ln .core { stroke-width: 0.4; opacity: 1; }
#stage.fine.wisp.solved .ln .hot { stroke-width: 0.12; }
#stage.fine.wisp .ln.thin .core { stroke-width: 0.15; opacity: 0.65; }
#stage.fine.wisp .ln.thin.sel .core { stroke-width: 0.28; opacity: 1; }
#stage.fine.wisp .ln.thin.sel .mid { stroke-width: 0.8; }
#stage.fine.wisp.solved .ln.thin .halo { stroke-width: 1.6; opacity: 0.1; }
#stage.fine.wisp.solved .ln.thin .mid { stroke-width: 0.7; opacity: 0.3; }

  }

  /* ---------- swiping anywhere on the screen ---------- */
  function distTo(pts, p) {
    var best = 1e9;
    for (var i = 1; i < pts.length; i++) {
      var ax = pts[i - 1][0], ay = pts[i - 1][1], bx = pts[i][0] - ax, by = pts[i][1] - ay;
      var len = bx * bx + by * by, u = len ? ((p[0] - ax) * bx + (p[1] - ay) * by) / len : 0;
      u = Math.max(0, Math.min(1, u));
      var d = Math.hypot(p[0] - ax - bx * u, p[1] - ay - by * u);
      if (d < best) best = d;
    }
    return best;
  }
  stage.addEventListener("pointerdown", function (e) {
    if (e.target.closest("button, #panel")) return;
    if (e.pointerType === "mouse" && e.button !== 0) return;
    if (complete || drag) return; // a finished picture stays lit until Scramble or Next
    var p = toSheet(e), best = -1, bd = 8;
    cur.forEach(function (pts, i) { var h = strokes[i].hide, d = h && h.mode === "hide" && vis[i] ? Math.min.apply(null, vis[i].map(function (r) { return distTo(r, p); })) : distTo(pts, p); if (d < bd) { bd = d; best = i; } }); // hidden joins can't be touched
    if (best >= 0 && best !== sel) select(best);
    drag = { id: e.pointerId, x: sideways(e), t: t[sel] };
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });
  stage.addEventListener("pointermove", function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    var raw = drag.t + px(sideways(e) - drag.x, sel);
    var d = raw - strokes[sel].t0;
    d -= Math.round(d);
    t[sel] = !together() && Math.abs(d) < px(8, sel) ? raw - d : raw; // a small catch as the line passes its real shape
    update();
  });
  function endDrag(e) {
    if (!drag || e.pointerId !== drag.id) return;
    drag = null;
    if (together()) snapAll(); else settle(sel, px(16, sel));
    update();
    saveNow();
  }
  stage.addEventListener("pointerup", endDrag);
  stage.addEventListener("pointercancel", endDrag);

  /* ---------- buttons and keys ---------- */
  $("next").addEventListener("click", function () { load((level + 1) % LEVELS.length, false); });
  $("again").addEventListener("click", function () { load(level, true); });
  $("count").addEventListener("click", function () { showCount = !showCount; save(); update(); });
  /* ---------- the Color button (a sample): gold, rainbow, shimmering, or a new color each time ---------- */
  var COLOR_MODES = ["Gold", "Rainbow", "Shimmer", "New colors"], CYC = ["#ff6fb5", "#6dff8e", "#5ad7ff", "#b48cff", "#ff9a3d", "#ff5a7a", "#7cf2e0"], cyc = 0, colorMode = 1;   // and the line you hold starts in rainbow colors
  function showColorMode() {
    stage.classList.toggle("cm-rainbow", colorMode === 1); stage.classList.toggle("cm-shimmer", colorMode === 2); stage.classList.toggle("cm-cycle", colorMode === 3);
    if (colorMode === 3) stage.style.setProperty("--selc", CYC[cyc]);
    $("colors").textContent = "Color: " + COLOR_MODES[colorMode];
    if (strokes.length && groups.length) paint(0);
  }
  try { var cm = parseInt(localStorage.getItem(KEY + "-color"), 10); if (cm >= 0 && cm < COLOR_MODES.length) colorMode = cm; } catch (e) {}
  try { if (reduce) { var sh = document.getElementById("shim"); if (sh) sh.parentNode.removeChild(sh); } } catch (e) {}   // with Reduce Motion on, the shimmer holds still
  showColorMode();
  /* ---------- the Lines button (a sample): colors for the loose lines ---------- */
  function showLineMode() {
    ["lm-own", "lm-few", "lm-rain", "lm-pic"].forEach(function (c, k) { stage.classList.toggle(c, lineMode === k + 1); });
    $("lmode").textContent = "Lines: " + LINE_MODES[lineMode]; if (strokes.length) update();   // never before a drawing is loaded (an empty drawing would count as finished)
  }
  try { var lmv = parseInt(localStorage.getItem(KEY + "-lines"), 10); if (lmv >= 0 && lmv < LINE_MODES.length) lineMode = lmv; } catch (e) {}
  showLineMode();
  $("lmode").addEventListener("click", function () { lineMode = (lineMode + 1) % LINE_MODES.length; try { localStorage.setItem(KEY + "-lines", String(lineMode)); } catch (e) {} showLineMode(); });
  $("colors").addEventListener("click", function () { colorMode = (colorMode + 1) % COLOR_MODES.length; try { localStorage.setItem(KEY + "-color", String(colorMode)); } catch (e) {} showColorMode(); });
  $("open").addEventListener("click", function () { renderTiles(); panel.hidden = false; showChapters(); });
  $("back").addEventListener("click", showChapters);
  $("close").addEventListener("click", function () { panel.hidden = true; $("open").focus(); });
  document.addEventListener("keydown", function (e) {
    if (!panel.hidden) { if (e.key === "Escape") { if (openChapter === null) panel.hidden = true; else showChapters(); } return; }
    if (complete) return;
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
      t[sel] += (e.key === "ArrowRight" ? 1 : -1) * px(3, sel);
      if (together()) snapAll(); else settle(sel, px(4, sel));
      update();
      saveNow();
      e.preventDefault();
    } else if (e.key === "ArrowUp" || e.key === "ArrowDown") {
      select((sel + (e.key === "ArrowDown" ? 1 : strokes.length - 1)) % strokes.length);
      e.preventDefault();
    }
  });

  /* ---------- start ---------- */
  function start(data) {
    restore();
    data = data || {};
    if (Array.isArray(data.solved)) data.solved.forEach(function (id) { if (typeof id === "string") solved[id] = true; });
    if (INDEX[data.level] !== undefined) level = INDEX[data.level];
    var now = null;
    try { now = JSON.parse(localStorage.getItem(KEY + "-now") || "null"); } catch (e) {}
    function fits(s) { return !!s && s.level === LEVELS[level].id && s.seed > 0 && Array.isArray(s.t) && s.t.every(function (v) { return typeof v === "number" && isFinite(v); }); }
    var keep = fits(data) ? data : fits(now) ? now : null; // the game in progress: from the app if it handed one over, otherwise from the last save on this phone
    layout();
    load(level, false, keep ? keep.seed : 0);
    if (keep && keep.t.length === t.length) { t = keep.t.slice(); shown = t.slice(); wasComplete = false; paint(0, true); update(); saveNow(); } // same drawing with the same number of lines: put every line back where it was
    renderTiles(); panel.hidden = false; showChapters();                // open on the chapter menu
    cloudConnect();
    window.addEventListener("resize", layout);
    try { new ResizeObserver(layout).observe(document.body); } catch (e) {}
  }
  var hot = window.claude && window.claude.hot;
  try { if (hot && hot.snapshot) hot.snapshot(function () { return { v: VERSION, level: LEVELS[level].id, t: t, seed: seed, solved: Object.keys(solved) }; }); } catch (e) {}
  if (hot && hot.ready) hot.ready(start); else start(hot && hot.data);
  window.RH_OK = true;
})(RH);


</script>
